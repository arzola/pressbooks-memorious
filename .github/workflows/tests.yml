name: Run Tests 🧪

on:
  push:
    branches:
      - dev
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - '**/*.yml'
      - 'composer.lock'
      - 'composer.json'
      - '!languages/**'
      - '!docs/**'
      - '!**/*.md'
  pull_request:
    branches:
      - dev
    paths:
      - '**/*.php'
      - '**/*.js'
      - '**/*.css'
      - '**/*.json'
      - '**/*.yml'
      - 'composer.lock'
      - 'composer.json'
      - '!languages/**'
      - '!docs/**'
      - '!**/*.md'
  workflow_dispatch:


jobs:
  plugin-tests:
    uses: pressbooks/reusable-workflows/.github/workflows/pb-plugin-tests.yml@main
    secrets: inherit
    with:
      requires_pressbooks: true
