name: Update .pot file 🌐

on:
  push:
    branches: [dev]
    paths:
      - "**/*.php"
      - "**/*.js"
  workflow_dispatch:


jobs:
  update-pot-file:
    uses: pressbooks/reusable-workflows/.github/workflows/update-pot.yml@main
    secrets: inherit
    with:
      domain: 'pressbooks-plugin-scaffold'
      slug: 'pressbooks-plugin-scaffold'
      package_name: 'Pressbooks Plugin Scaffold'
      headers: '{"Report-Msgid-Bugs-To": "https://github.com/pressbooks/pressbooks-plugin-scaffold/issues"}'
